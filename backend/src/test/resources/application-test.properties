# Isolated H2 database for automated tests.
# This profile MUST NEVER point at the real development MySQL database.
# Schema is created from JPA entities on startup and dropped afterwards.
spring.datasource.url=jdbc:h2:mem:hostel_test_db;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Test-only dummy JWT value for the ephemeral in-memory database.
# It never signs tokens for real data and is not a production secret.
jwt.secret=test-only-dummy-jwt-secret-for-h2-ephemeral-db-00

# No demo seeding and no mail side effects during tests.
app.data-seeder.enabled=false
app.demo-data.reset=false
app.demo-data.seed-on-empty=false
app.mail.enabled=false
